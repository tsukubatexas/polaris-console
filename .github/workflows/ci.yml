name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check workflow pinning
        run: scripts/check_actions_pinned.sh
      - name: Check generated registries
        run: scripts/check_generated_current.py
      - name: Lint backend
        run: ruff check .
      - name: Test backend
        run: pytest
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check Helm chart
        run: scripts/helm_checks.sh
      - name: Build and smoke-test container
        run: |
          docker build -t polaris-console:ci .
          scripts/container_smoke_test.sh polaris-console:ci
